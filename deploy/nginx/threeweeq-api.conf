# /etc/nginx/sites-available/threeweeq-api
# Replace API_DOMAIN with the real subdomain before enabling.
# Medusa Admin is served at https://API_DOMAIN/app.
#
# Notes
#  - Uploaded catalog media lives on disk under MEDIA_UPLOAD_DIR (default
#    `static`) and is served by Medusa itself at /static/...; the alias below is
#    only needed if you move the directory outside the project.
#  - Keep client_max_body_size above the largest product image you accept; the
#    Studio uploads straight to Medusa, not to the storefront.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    client_max_body_size 50m;

    # --- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location /static/ {
        alias /var/www/threeweeq/medusa/static/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
